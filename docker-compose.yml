services:
  postgres:
    image: postgres:16-alpine
    container_name: prospectai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospectai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospectai}
      POSTGRES_DB: ${POSTGRES_DB:-prospectai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospectai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prospectai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prospectai_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
    command:
      ["/bin/sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prospectai_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Docker Desktop en Windows no propaga eventos de archivos: sin polling no hay recarga en caliente
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Integración externa: gosom/google-maps-scraper en modo web (API HTTP + SQLite).
  # Se levanta como servicio permanente; el backend lo consume vía HTTP.
  google-maps-scraper:
    image: gosom/google-maps-scraper:latest
    container_name: prospectai_scraper
    restart: unless-stopped
    command: ["-web", "-addr", ":8080", "-data-folder", "/app/data"]
    ports:
      - "8080:8080"
    volumes:
      - scraper_data:/app/data

  # Worker ARQ: procesa jobs encolados (envío de campañas WhatsApp, etc.)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prospectai_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: arq app.infrastructure.workers.worker_settings.WorkerSettings
    volumes:
      - ./backend:/app

  # Servidor OpenWA (@open-wa/wa-automate): conecta con WhatsApp Web vía Chromium.
  # Escaneá el QR con tu celular la primera vez; la sesión queda guardada en openwa_data.
  openwa:
    build:
      context: ./integrations/openwa
      dockerfile: Dockerfile
    container_name: prospectai_openwa
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - WA_SESSION=main
    volumes:
      - openwa_data:/data

volumes:
  postgres_data:
  redis_data:
  scraper_data:
  openwa_data:
